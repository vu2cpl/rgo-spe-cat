; ============================================================
;  RGO ONE SPE CAT Server — PlatformIO
;  ESP32-S3 CAT bridge: polls the RGO ONE over USB host and feeds
;  Kenwood-format frequency to the SPE amp, plus TCP CAT for Hamlib/WSJT-X.
;
;  Flash:  ./flash.sh            (build + upload; picks the serial port)
;          ./monitor.sh          (serial monitor; picks the port)
;  upload_port / monitor_port are deliberately NOT pinned — see flash.sh.
;
;  Platform: pioarduino (Arduino-ESP32 3.3.x / IDF 5.x). The radio link is
;  built on the IDF USB host stack (usb/usb_host.h), which ships in it.
; ============================================================

[env:rgo-spe-cat]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ESP32-S3 N16R8: 16 MB quad flash + 8 MB octal PSRAM. Same board as
; esp32-vukeyer's esp32s3 env (eFuse-verified there 2026-09-23). The
; devkitc-1 board file assumes 8 MB / no PSRAM, so override all of it.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

; The native USB port is the USB *host* to the radio, so the console and
; flashing go through the "COM" port: a CH343 (1A86:55D3) on GPIO43/44
; with auto-reset. Gotcha: the CH343 is powered from the board, not from
; its own connector, so it only appears when the board has power from
; elsewhere (the native port or the 5V pin).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/tzapu/WiFiManager.git#v2.0.17
